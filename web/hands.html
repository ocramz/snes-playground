<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dream Course — hole 1, by hand</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0b14; overflow: hidden; }
    #game { width: 100vw; height: 100vh; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
    #err { position: fixed; inset: 0; display: none; place-items: center; color: #ddd;
           font: 14px/1.5 monospace; text-align: center; padding: 2rem; white-space: pre-wrap; }
    /* the webcam inset (src/hands/control.ts); V hides it */
    #cam { position: fixed; right: 12px; bottom: 12px; width: 288px; height: 162px; overflow: hidden;
           border-radius: 6px; background: rgba(0, 0, 0, 0.55); opacity: 0.9;
           box-shadow: 0 2px 12px rgba(0, 0, 0, 0.6); pointer-events: none; }
    #cam.hidden { display: none; }
    #cam .cam-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #cam-overlay { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: auto; }
    #cam-status { position: absolute; left: 6px; top: 4px; right: 6px; color: #eee; white-space: pre-wrap;
                  font: 10px/1.35 ui-monospace, monospace; text-shadow: 0 0 3px #000, 0 0 2px #000; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="cam"><canvas id="cam-overlay"></canvas><div id="cam-status"></div></div>
  <div id="err"></div>
  <script type="module" src="/src/hands/main.ts"></script>
</body>
</html>
